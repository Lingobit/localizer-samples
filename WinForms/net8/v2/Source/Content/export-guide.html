<html lang="en"><head><title>Export guide</title></head><body>
<h1>Prepare your document for export</h1>
<p>Choose a preset, review the page settings, then export your document.</p>
<p>High quality preserves fine details and embedded fonts. A smaller file is easier to share.</p>
<h2>After export</h2>
<p>Select Open folder after export to review the document in its destination folder.</p>
